name: Weekly Synthesis

on:
  schedule:
    # Sunday 18:00 UTC is Monday 02:00 in Asia/Shanghai (UTC+8).
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      config:
        description: Chipyard configuration class to synthesize and analyze
        required: false
        default: TapeoutConfig
        type: choice
        options:
          - TapeoutConfig
          - TapeoutRocketConfig
          - QuadChannelRocketConfig
          - MediumBoomV3CosimFastConfig
          - MediumBoomV4CosimFastConfig
      technology:
        description: Full-replacement standard-cell, IO, ROM, and SRAM technology
        required: true
        default: smic180
        type: choice
        options:
          - smic180
      benchmark:
        description: Power-analysis workload
        required: true
        default: dhrystone
        type: choice
        options:
          - dhrystone
          - fpu-stress
      use_sdf:
        description: Annotate the Dhrystone GLS run with the synthesized SDF
        required: true
        default: true
        type: boolean
      clock_period_ns:
        description: Clock period in ns (optional; blank uses the technology default)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-synthesis-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  synthesis:
    name: Synthesize ${{ inputs.config || 'TapeoutConfig' }} and report PT power
    # The runner must have valid Design Compiler, VCS, PrimeTime, and Verdi
    # licenses plus the PDK paths used by the selected synthesis technology.
    runs-on: [self-hosted, linux, builder]
    timeout-minutes: 720
    env:
      CI_SHARED_ROOT: /data1/ci-runner
      DC_CONTAINER: ci_env
      HTTP_PROXY: http://127.0.0.1:12000
      HTTPS_PROXY: http://127.0.0.1:12000
      NO_PROXY: localhost,127.0.0.1
      SYNTHESIS_CONFIG: ${{ inputs.config || 'TapeoutConfig' }}
      SYNTHESIS_TECH: ${{ inputs.technology || 'smic180' }}
      POWER_BENCHMARK: ${{ inputs.benchmark || 'dhrystone' }}
      POWER_USE_SDF: ${{ github.event_name != 'workflow_dispatch' && '1' || (inputs.use_sdf && '1' || '0') }}
      CLOCK_PERIOD: ${{ inputs.clock_period_ns || '' }}
    steps:
      - name: Checkout Chipyard
        uses: actions/checkout@v4
        with:
          path: ci-workspaces/chipyard
          submodules: false

      - name: Checkout synthesis flow
        uses: actions/checkout@v4
        with:
          repository: SEU-ACAL/Tapeout-Workbench
          # With no ref, actions/checkout uses the repository's default branch.
          # Weekly synthesis therefore tracks the latest Tapeout-Workbench flow.
          path: ci-workspaces/tapeout-workbench
          persist-credentials: false

      - name: Prepare isolated synthesis paths
        run: |
          run_dir="${CI_SHARED_ROOT}/weekly-synthesis/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          mkdir -p "${run_dir}"
          echo "CI_SYNTHESIS_RUN_ROOT=${run_dir}" >> "$GITHUB_ENV"
          echo "CI_CHIPYARD_WORKSPACE=${GITHUB_WORKSPACE}/ci-workspaces/chipyard" >> "$GITHUB_ENV"
          echo "CI_TAPEOUT_WORKBENCH=${GITHUB_WORKSPACE}/ci-workspaces/tapeout-workbench" >> "$GITHUB_ENV"

      - name: Generate RTL and run Design Compiler
        run: |
          env \
            GITHUB_WORKSPACE="${CI_CHIPYARD_WORKSPACE}" \
            SYNTHESIS_WORKBENCH="${CI_TAPEOUT_WORKBENCH}" \
            CI_SYNTHESIS_RUN_ROOT="${CI_SYNTHESIS_RUN_ROOT}" \
            "${CI_CHIPYARD_WORKSPACE}/.github/scripts/ci/run-weekly-synthesis.sh"

      - name: Publish synthesis summary
        if: always()
        run: |
          summary_file="${CI_SYNTHESIS_RUN_ROOT}/synthesis-summary.md"
          if [[ -s "${summary_file}" ]]; then
            cat "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "## Weekly synthesis"
              echo
              echo "Synthesis summary was not produced. Check the Generate RTL and run Design Compiler logs."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Run PrimeTime power analysis
        run: |
          env \
            GITHUB_WORKSPACE="${CI_CHIPYARD_WORKSPACE}" \
            SYNTHESIS_WORKBENCH="${CI_TAPEOUT_WORKBENCH}" \
            CI_SYNTHESIS_RUN_ROOT="${CI_SYNTHESIS_RUN_ROOT}" \
            "${CI_CHIPYARD_WORKSPACE}/.github/scripts/ci/run-weekly-power.sh"
