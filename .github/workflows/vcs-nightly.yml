name: VCS Nightly Regression

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vcs-nightly-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-vcs:
    name: Build VCS Rocket and BOOM simulators
    runs-on: [self-hosted, linux, builder]
    timeout-minutes: 360
    outputs:
      run_dir: ${{ steps.paths.outputs.run_dir }}
      artifact_root: ${{ steps.paths.outputs.artifact_root }}
    env:
      CI_SHARED_ROOT: /data1/ci-runner
      CI_VCS_BUILD_JOBS: 8
      CI_VCS_BUILD_CONFIGS: QuadChannelRocketConfig MediumBoomV3CosimFastConfig MediumBoomV4CosimFastConfig
      HTTP_PROXY: http://127.0.0.1:12000
      HTTPS_PROXY: http://127.0.0.1:12000
      NO_PROXY: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - name: Prepare artifact paths
        id: paths
        run: |
          run_dir="${CI_SHARED_ROOT}/vcs-nightly/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          echo "CI_ARTIFACT_ROOT=${run_dir}/simulators" >> "$GITHUB_ENV"
          echo "run_dir=${run_dir}" >> "$GITHUB_OUTPUT"
          echo "artifact_root=${run_dir}/simulators" >> "$GITHUB_OUTPUT"

      - name: Build VCS simulators
        run: .github/scripts/ci/build-core-regressions-vcs.sh

  regression-vcs:
    name: Run VCS Rocket and BOOM regressions
    needs: build-vcs
    runs-on: [self-hosted, linux, runner]
    timeout-minutes: 360
    env:
      CI_SHARED_ROOT: /data1/ci-runner
      CI_WORKLOAD_ROOT: /data2/ci-workloads
      CI_ARTIFACT_ROOT: ${{ needs.build-vcs.outputs.artifact_root }}
      CI_RESULT_ROOT: ${{ needs.build-vcs.outputs.run_dir }}/results
      CI_VCS_TEST_JOBS: 8
    steps:
      - uses: actions/checkout@v4

      - name: Initialize Chipyard submodules
        run: ./init-submodules.sh

      - name: Run VCS regressions in parallel
        run: .github/scripts/ci/run-core-regressions-vcs-parallel.sh

      - name: Write VCS regression summary
        if: always()
        run: |
          echo "## VCS Rocket and BOOM regressions" >> "$GITHUB_STEP_SUMMARY"
          for testcase in rocket-asm rocket-bmark rocket-hello-loadmem rocket-hello rocket-zephyr-hello boom-asm-v3 boom-bmark-v3 boom-asm-v4 boom-bmark-v4; do
            result="${CI_RESULT_ROOT}/${testcase}/result.json"
            if [[ -f "${result}" ]]; then
              cat "${result}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No result was produced for ${testcase}." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
