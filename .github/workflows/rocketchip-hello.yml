name: Rocket Chip Hello

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rocketchip-hello-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      needs_hello: ${{ steps.filter.outputs.all_count != steps.filter.outputs.skip_hello_count }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            all:
              - '**'

            # Skip the emulator build when every changed path is documentation
            # or repository metadata that cannot affect the hello flow.
            skip_hello:
              - 'docs/**'
              - '**/*.md'
              - '**/.gitignore'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/PULL_REQUEST_TEMPLATE.md'
              - '.github/dependabot.yml'
              - '.mergify.yml'

  hello:
    name: Build and Run Rocket Chip Hello
    needs: changes
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.needs_hello == 'true')
    runs-on: [self-hosted, linux, builder]
    env:
      CI_SHARED_ROOT: /data2/ci-runner
      CI_BUILD_JOBS: 32
      HTTP_PROXY: http://127.0.0.1:12000
      HTTPS_PROXY: http://127.0.0.1:12000
      NO_PROXY: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - name: Prepare result paths
        run: |
          run_dir="${CI_SHARED_ROOT}/rocketchip/run-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
          echo "CI_RUN_DIR=${run_dir}" >> "$GITHUB_ENV"
          echo "CI_RESULT_DIR=${run_dir}/hello" >> "$GITHUB_ENV"
          mkdir -p "${run_dir}/hello"

      - name: Build Rocket Chip emulator
        run: .github/scripts/ci/build-rocketchip.sh

      - name: Run hello
        id: hello
        run: |
          set -o pipefail
          .github/scripts/ci/run-hello.sh 2>&1 | tee "${CI_RESULT_DIR}/workflow.log"

      - name: Delete temporary binaries
        if: always()
        run: |
          rm -rf "${CI_RESULT_DIR}/tests-build"

      - name: Write hello summary
        if: always()
        run: |
          echo "## Rocket Chip hello" >> "$GITHUB_STEP_SUMMARY"
          cat "${CI_RESULT_DIR}/result.json" >> "$GITHUB_STEP_SUMMARY"
