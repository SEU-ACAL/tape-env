name: Rocket Chip Hello

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rocketchip-hello-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_SHARED_ROOT: /data2/ci-runner
  CI_BUILD_JOBS: 32
  CI_SIMULATOR_NAME: simulator-chipyard.harness-RocketConfig
  CI_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
  HTTP_PROXY: http://127.0.0.1:12000
  HTTPS_PROXY: http://127.0.0.1:12000
  NO_PROXY: localhost,127.0.0.1

jobs:
  build:
    name: Build Rocket Chip
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, builder]
    outputs:
      artifact_dir: ${{ steps.publish.outputs.artifact_dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare artifact paths
        run: |
          run_dir="${CI_SHARED_ROOT}/rocketchip/run-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:12}"
          echo "CI_RUN_DIR=${run_dir}" >> "$GITHUB_ENV"
          echo "CI_ARTIFACT_DIR=${run_dir}/emu" >> "$GITHUB_ENV"

      - name: Build Rocket Chip emulator
        run: .github/scripts/ci/build-rocketchip.sh

      - name: Publish emulator artifact
        id: publish
        run: .github/scripts/ci/publish-artifact.sh

  run-hello:
    name: Run Rocket Chip Hello
    needs: build
    runs-on: [self-hosted, linux, runner]
    steps:
      - uses: actions/checkout@v4

      - name: Prepare result paths
        run: |
          artifact_dir="${{ needs.build.outputs.artifact_dir }}"
          run_dir="$(dirname "${artifact_dir}")"
          echo "CI_RUN_DIR=${run_dir}" >> "$GITHUB_ENV"
          echo "CI_ARTIFACT_DIR=${artifact_dir}" >> "$GITHUB_ENV"
          echo "CI_RESULT_DIR=${run_dir}/hello" >> "$GITHUB_ENV"
          mkdir -p "${run_dir}/hello"

      - name: Restore Rocket Chip emulator
        run: .github/scripts/ci/restore-artifact.sh

      - name: Run hello
        id: hello
        run: |
          set -o pipefail
          .github/scripts/ci/run-hello.sh 2>&1 | tee "${CI_RESULT_DIR}/workflow.log"

      - name: Delete temporary binaries
        if: always()
        run: |
          rm -rf "${CI_RESULT_DIR}/tests-build"

      - name: Write hello summary
        if: always()
        run: |
          echo "## Rocket Chip hello" >> "$GITHUB_STEP_SUMMARY"
          cat "${CI_RESULT_DIR}/result.json" >> "$GITHUB_STEP_SUMMARY"
