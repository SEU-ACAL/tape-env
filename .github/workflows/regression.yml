name: Regression Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      config:
        description: Chipyard configuration class to build and test
        required: false
        default: TapeoutConfig
        type: choice
        options:
          - TapeoutConfig
          - QuadChannelRocketConfig
          - MediumBoomV3CosimFastConfig
          - MediumBoomV4CosimFastConfig

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    # Dependency update PRs do not need to consume the self-hosted regression
    # runners. The PR author is used instead of github.actor so maintainer
    # retries or updates remain classified as Dependabot PRs.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      needs_regression: ${{ steps.filter.outputs.all_count != steps.filter.outputs.skip_regression_count }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            all:
              - '**'

            # Skip the emulator build when every changed path is documentation
            # or repository metadata. CI changes run the regression they modify.
            skip_regression:
              - 'docs/**'
              - '**/*.md'
              - '**/.gitignore'
              - '.github/dependabot.yml'
              - '.mergify.yml'

  regression:
    name: Run Verilator and VCS regressions
    needs: changes
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.needs_regression == 'true')
    runs-on: [self-hosted, linux, builder]
    timeout-minutes: 360
    env:
      CI_SHARED_ROOT: /data1/ci-runner
      CI_WORKLOAD_ROOT: /data2/ci-workloads
      CI_TIMEOUT_CYCLES: 200000000
      HTTP_PROXY: http://127.0.0.1:12000
      HTTPS_PROXY: http://127.0.0.1:12000
      NO_PROXY: localhost,127.0.0.1
      CI_VCS_CONFIG: ${{ inputs.config || 'TapeoutConfig' }}
    steps:
      - name: Checkout Verilator workspace
        uses: actions/checkout@v4
        with:
          path: ci-workspaces/verilator
          fetch-depth: 0

      - name: Checkout VCS workspace
        uses: actions/checkout@v4
        with:
          path: ci-workspaces/vcs
          fetch-depth: 0

      - name: Prepare isolated CI paths
        run: |
          run_dir="${CI_SHARED_ROOT}/regression/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          mkdir -p "${run_dir}"
          echo "CI_RUN_DIR=${run_dir}" >> "$GITHUB_ENV"
          echo "CI_VERILATOR_WORKSPACE=${GITHUB_WORKSPACE}/ci-workspaces/verilator" >> "$GITHUB_ENV"
          echo "CI_VCS_WORKSPACE=${GITHUB_WORKSPACE}/ci-workspaces/vcs" >> "$GITHUB_ENV"

      - name: Build Verilator and VCS simulators in parallel
        run: |
          build_verilator() {
            env \
              GITHUB_WORKSPACE="${CI_VERILATOR_WORKSPACE}" \
              CI_SHARED_ROOT="${CI_RUN_DIR}/verilator-ci" \
              CI_CACHE_ROOT=/data1/ci-runner/cache/regression/verilator \
              CI_ARTIFACT_ROOT="${CI_RUN_DIR}/verilator-artifacts" \
              CI_RESULT_ROOT="${CI_RUN_DIR}/verilator-results" \
              CI_BUILD_JOBS=8 \
              CI_VERILATOR_MAKE_JOBS=8 \
              CI_BUILD_CONFIGS="QuadChannelRocketConfig MediumBoomV3CosimFastConfig" \
              CI_TEST_JOBS=8 \
              "${CI_VERILATOR_WORKSPACE}/.github/scripts/ci/build-core-regressions.sh"
          }

          build_vcs() {
            env \
              GITHUB_WORKSPACE="${CI_VCS_WORKSPACE}" \
              CI_SHARED_ROOT="${CI_RUN_DIR}/vcs-ci" \
              CI_CACHE_ROOT=/data1/ci-runner/cache/regression/vcs \
              CI_ARTIFACT_ROOT="${CI_RUN_DIR}/vcs-artifacts" \
              CI_RESULT_ROOT="${CI_RUN_DIR}/vcs-results" \
              CI_VCS_BUILD_JOBS=8 \
              CI_VCS_BUILD_CONFIGS="${CI_VCS_CONFIG}" \
              USE_SMIC180_IO=1 \
              USE_SMIC180_STD=1 \
              USE_SMIC180_SRAM=1 \
              USE_SMIC180_ROM=1 \
              SMIC180_SRAM_ROOT=/data2/smic180/SRAM/S018SP_v0p1pc_CDK/SMIC180_S018SP_v0p1c_20260722 \
              "${CI_VCS_WORKSPACE}/.github/scripts/ci/build-core-regressions-vcs.sh"
          }

          build_verilator > "${CI_RUN_DIR}/verilator-build.log" 2>&1 &
          verilator_pid=$!
          build_vcs > "${CI_RUN_DIR}/vcs-build.log" 2>&1 &
          vcs_pid=$!

          status=0
          wait "${verilator_pid}" || status=1
          wait "${vcs_pid}" || status=1
          exit "${status}"

      - name: Run Verilator and VCS regressions in parallel
        run: |
          run_verilator() {
            env \
              GITHUB_WORKSPACE="${CI_VERILATOR_WORKSPACE}" \
              CI_ARTIFACT_ROOT="${CI_RUN_DIR}/verilator-artifacts" \
              CI_RESULT_ROOT="${CI_RUN_DIR}/verilator-results" \
              CI_TEST_JOBS=8 \
              CI_SIM_TEST_JOBS=4 \
              "${CI_VERILATOR_WORKSPACE}/.github/scripts/ci/run-core-regressions-parallel.sh"
          }

          run_vcs() {
            env \
              GITHUB_WORKSPACE="${CI_VCS_WORKSPACE}" \
              CI_ARTIFACT_ROOT="${CI_RUN_DIR}/vcs-artifacts" \
              CI_RESULT_ROOT="${CI_RUN_DIR}/vcs-results" \
              CI_VCS_TEST_JOBS=8 \
              CI_VCS_SIM_TEST_JOBS=4 \
              CI_CONFIG="${CI_VCS_CONFIG}" \
              USE_SMIC180_IO=1 \
              USE_SMIC180_STD=1 \
              USE_SMIC180_SRAM=1 \
              USE_SMIC180_ROM=1 \
              SMIC180_SRAM_ROOT=/data2/smic180/SRAM/S018SP_v0p1pc_CDK/SMIC180_S018SP_v0p1c_20260722 \
              "${CI_VCS_WORKSPACE}/.github/scripts/ci/run-core-regressions-vcs-parallel.sh"
          }

          run_verilator > "${CI_RUN_DIR}/verilator-regression.log" 2>&1 &
          verilator_pid=$!
          run_vcs > "${CI_RUN_DIR}/vcs-regression.log" 2>&1 &
          vcs_pid=$!

          status=0
          wait "${verilator_pid}" || status=1
          wait "${vcs_pid}" || status=1
          exit "${status}"

      - name: Generate selected configuration register map
        if: always()
        run: |
          regmap_dir="${CI_RUN_DIR}/${CI_VCS_CONFIG}-regmap"
          generated_src="${CI_VCS_WORKSPACE}/soc-generator/sims/vcs/generated-src/chipyard.harness.TestHarness.${CI_VCS_CONFIG}"
          mkdir -p "${regmap_dir}"
          if [[ -f "${generated_src}/chipyard.harness.TestHarness.${CI_VCS_CONFIG}.dts" ]]; then
            python3 "${CI_VCS_WORKSPACE}/.github/scripts/ci/generate-tapeout-regmap.py" \
              --generated-src "${generated_src}" \
              --output-dir "${regmap_dir}" \
              --config "${CI_VCS_CONFIG}"
          else
            printf '%s elaboration did not produce a DTS; register map is unavailable.\n' "${CI_VCS_CONFIG}" \
              > "${regmap_dir}/unavailable.txt"
          fi

      - name: Write regression summary
        if: always()
        run: |
          echo "## Verilator regressions" >> "$GITHUB_STEP_SUMMARY"
          find "${CI_RUN_DIR}/verilator-results" -name result.json -print0 2>/dev/null |
            sort -z | xargs -0 -r -n1 cat >> "$GITHUB_STEP_SUMMARY"
          echo "## ${CI_VCS_CONFIG} VCS regressions" >> "$GITHUB_STEP_SUMMARY"
          find "${CI_RUN_DIR}/vcs-results" -name result.json -print0 2>/dev/null |
            sort -z | xargs -0 -r -n1 cat >> "$GITHUB_STEP_SUMMARY"
          regmap_summary="${CI_RUN_DIR}/${CI_VCS_CONFIG}-regmap/tapeout-regmap-summary.md"
          if [[ -f "${regmap_summary}" ]]; then
            cat "${regmap_summary}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## ${CI_VCS_CONFIG} Register Map" >> "$GITHUB_STEP_SUMMARY"
            echo "Register map unavailable because ${CI_VCS_CONFIG} elaboration did not complete." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload selected configuration register map
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.CI_VCS_CONFIG }}-regmap
          path: "${{ env.CI_RUN_DIR }}/${{ env.CI_VCS_CONFIG }}-regmap"
          if-no-files-found: warn

      - name: Print regression failure diagnostics
        if: failure()
        run: |
          logs=(
            "${CI_RUN_DIR}/verilator-build.log"
            "${CI_RUN_DIR}/vcs-build.log"
            "${CI_RUN_DIR}/verilator-regression.log"
            "${CI_RUN_DIR}/vcs-regression.log"
          )

          for log in "${logs[@]}"; do
            if [[ -f "${log}" ]]; then
              echo "::group::Last 400 lines of ${log}"
              tail -n 400 "${log}"
              echo "::endgroup::"
            else
              echo "Diagnostic log was not produced: ${log}" >&2
            fi
          done

      - name: Archive regression failure diagnostics
        if: failure()
        run: |
          archive="${RUNNER_TEMP}/regression-failure-diagnostics.tar.gz"
          paths=()
          for path in \
            "${CI_RUN_DIR}/verilator-build.log" \
            "${CI_RUN_DIR}/vcs-build.log" \
            "${CI_RUN_DIR}/verilator-regression.log" \
            "${CI_RUN_DIR}/vcs-regression.log" \
            "${CI_RUN_DIR}/verilator-artifacts" \
            "${CI_RUN_DIR}/vcs-artifacts" \
            "${CI_RUN_DIR}/verilator-results" \
            "${CI_RUN_DIR}/vcs-results"
          do
            if [[ -e "${path}" ]]; then
              paths+=("${path#"${CI_RUN_DIR}/"}")
            fi
          done

          if [[ ${#paths[@]} -eq 0 ]]; then
            echo "No regression diagnostics were produced." >&2
            exit 0
          fi

          tar -C "${CI_RUN_DIR}" -czf "${archive}" "${paths[@]}"

      - name: Upload regression failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: regression-failure-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/regression-failure-diagnostics.tar.gz
          if-no-files-found: warn
          retention-days: 14
