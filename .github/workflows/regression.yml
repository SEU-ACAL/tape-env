name: Regression Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      needs_regression: ${{ steps.filter.outputs.all_count != steps.filter.outputs.skip_regression_count }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            all:
              - '**'

            # Skip the emulator build when every changed path is documentation
            # or repository metadata. CI changes run the regression they modify.
            skip_regression:
              - 'docs/**'
              - '**/*.md'
              - '**/.gitignore'
              - '.github/dependabot.yml'
              - '.mergify.yml'

  build:
    name: Build Rocket and BOOM emulators
    needs: changes
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.needs_regression == 'true')
    runs-on: [self-hosted, linux, builder]
    timeout-minutes: 180
    outputs:
      run_dir: ${{ steps.paths.outputs.run_dir }}
      artifact_root: ${{ steps.paths.outputs.artifact_root }}
    env:
      CI_SHARED_ROOT: /data1/ci-runner
      CI_BUILD_JOBS: 8
      CI_VERILATOR_MAKE_JOBS: 8
      CI_BUILD_CONFIGS: QuadChannelRocketConfig MediumBoomV3CosimFastConfig MediumBoomV4CosimFastConfig
      HTTP_PROXY: http://127.0.0.1:12000
      HTTPS_PROXY: http://127.0.0.1:12000
      NO_PROXY: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@v4

      - name: Prepare artifact paths
        id: paths
        run: |
          run_dir="${CI_SHARED_ROOT}/regression/run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
          echo "CI_ARTIFACT_ROOT=${run_dir}/emu" >> "$GITHUB_ENV"
          echo "run_dir=${run_dir}" >> "$GITHUB_OUTPUT"
          echo "artifact_root=${run_dir}/emu" >> "$GITHUB_OUTPUT"

      - name: Build emulators
        run: .github/scripts/ci/build-core-regressions.sh

  regression:
    name: Run Rocket and BOOM regressions
    needs: build
    runs-on: [self-hosted, linux, runner]
    timeout-minutes: 180
    env:
      CI_SHARED_ROOT: /data1/ci-runner
      CI_WORKLOAD_ROOT: /data2/ci-workloads
      CI_ARTIFACT_ROOT: ${{ needs.build.outputs.artifact_root }}
      CI_RESULT_ROOT: ${{ needs.build.outputs.run_dir }}/results
      CI_TEST_JOBS: 8
    steps:
      - uses: actions/checkout@v4

      - name: Initialize Chipyard submodules
        run: dependencies/scripts/init-submodules.sh

      - name: Run regressions in parallel
        run: .github/scripts/ci/run-core-regressions-parallel.sh

      - name: Write regression summary
        if: always()
        run: |
          echo "## Rocket and BOOM regressions" >> "$GITHUB_STEP_SUMMARY"
          for testcase in rocket-asm rocket-bmark rocket-hello-loadmem rocket-hello rocket-zephyr-hello boom-asm-v3 boom-bmark-v3 boom-asm-v4 boom-bmark-v4; do
            result="${CI_RESULT_ROOT}/${testcase}/result.json"
            if [[ -f "${result}" ]]; then
              cat "${result}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "No result was produced for ${testcase}." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
